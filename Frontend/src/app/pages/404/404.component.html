<a class="skip-link" href="#not-found-main">Pređi na glavni sadržaj</a>

<main id="not-found-main" class="not-found-page">
  <canvas #particlesCanvas class="particles-bg-canvas" aria-hidden="true"></canvas>

  <div class="not-found-container">
    <div #stageElement class="craft-stage" aria-hidden="true">
      <div class="ambient-shadow"></div>
      <div class="compass-3d-assembly">
        <div class="leather-holster-layer">
          <div class="hanging-loop">
            <div class="brass-ring"></div>
            <div class="leather-strap-loop"></div>
          </div>

          <div class="pouch-body">
            <div class="pouch-stitch-contour"></div>
            <div class="leather-flap">
              <div class="flap-stitch"></div>
              <div class="brass-snap-button">
                <div class="snap-inner"></div>
              </div>
              <div class="embossed-city">SKIN</div>
            </div>
          </div>
        </div>

        <div class="brass-compass-layer">
          <div class="compass-top-latch"></div>

          <div class="brass-body-ring">
            <div class="bezel-ridge"></div>

            <div class="compass-dial-face">
              <span class="cardinal north">N</span>
              <span class="cardinal east">E</span>
              <span class="cardinal south">S</span>
              <span class="cardinal west">W</span>

              <div class="dial-graduations"></div>
              <div class="compass-rose-star"></div>

              <div class="needle-assembly">
                <div class="needle-wing north-wing-left"></div>
                <div class="needle-wing north-wing-right"></div>
                <div class="needle-wing south-wing-left"></div>
                <div class="needle-wing south-wing-right"></div>
                <div class="pivot-gem"></div>
              </div>

              <div class="glass-dome-glare"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="content-wrapper">
      <p class="eyebrow">Stranica nije pronađena</p>
      <h1>Tražena stranica <em>nije pronađena.</em></h1>
      <p class="description">
        Stranica koju tražite je premeštena, obrisana ili trenutno nije dostupna u našoj prodavnici.
      </p>

      <div class="actions">
        <a routerLink="/home" class="primary-button">
          <span>Povratak na početnu</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </div>
</main>
