<main class="auth-page" id="glavni-sadrzaj">
  <div class="auth-container">
    <div class="auth-header">
      <p class="eyebrow">Dobrodošli nazad</p>
      <h1>Prijava na nalog</h1>
      <p class="sub-text">Unesite vaše pristupne podatke za brzu kupovinu i uvid u Vaše porudžbine.</p>
    </div>

    <form class="auth-form" (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group">
        <label for="login-email">Imejl adresa</label>
        <input id="login-email" type="email" [(ngModel)]="email" name="email" placeholder="vaša@adresa.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="login-password">Lozinka</label>
          <a routerLink="/zaboravljena-lozinka" class="forgot-link">Zaboravili ste lozinku?</a>
        </div>
        <div class="input-wrapper">
          <input
            id="login-password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Vaša lozinka"
            required
            autocomplete="current-password"
          >
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Sakrij lozinku' : 'Prikaži lozinku'"
          >
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
          <span class="custom-checkbox"></span>
          <span>Zapamti me na ovom uređaju</span>
        </label>
      </div>

      <button type="submit" class="submit-button" [disabled]="!isFormValid">
        Prijavi se <span aria-hidden="true">→</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Nemate nalog? <a routerLink="/register" class="auth-link">Registrujte se</a></p>
    </div>
  </div>
</main>
