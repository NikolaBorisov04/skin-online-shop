<main class="auth-page" id="glavni-sadrzaj">
  <div class="auth-container">
    <div class="auth-header">
      <p class="eyebrow">Dobrodošli nazad</p>
      <h1>Prijava na nalog</h1>
      <p class="sub-text">Unesite vaše pristupne podatke za brzu kupovinu i uvid u Vaše porudžbine.</p>
    </div>

    <form class="auth-form" (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group">
        <label for="login-email">Imejl adresa</label>
        <input id="login-email" type="email" [(ngModel)]="email" name="email" placeholder="vaša@adresa.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="login-password">Lozinka</label>
          <a routerLink="/zaboravljena-lozinka" class="forgot-link">Zaboravili ste lozinku?</a>
        </div>
        <input id="login-password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
          <span class="custom-checkbox"></span>
          <span>Zapamti me na ovom uređaju</span>
        </label>
      </div>

      <button type="submit" class="submit-button">
        Prijavi se <span aria-hidden="true">→</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Nemate nalog? <a routerLink="/register" class="auth-link">Registrujte se</a></p>
    </div>
  </div>
</main>
